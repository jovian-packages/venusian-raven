name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # The Windowless suite runs on Raven's host platform with the null renderer: Raven opens no
    # OS window and needs no display or Vulkan loader.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    name: PHP ${{ matrix.php }} ${{ matrix.ts == 'zts' && 'ZTS' || 'NTS' }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Refuse a PHP of the wrong thread safety
        env:
          PHP_ZTS: ${{ matrix.ts == 'zts' && '1' || '0' }}
        run: |
          php -r 'if ((int) PHP_ZTS !== (int) getenv("PHP_ZTS")) { fwrite(STDERR, "PHP ".PHP_VERSION." is ".(PHP_ZTS ? "ZTS" : "NTS").", the cell asked for the other".PHP_EOL); exit(1); }
            echo "PHP ", PHP_VERSION, PHP_ZTS ? " ZTS" : " NTS", PHP_EOL;'

      # Raven is vendored in ext-raven; on Linux it compiles against the X11 headers alone.
      - name: Install the X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev pkg-config

      - name: Build ext-raven
        run: |
          # Linux's scan directory is root's; Homebrew's PHP 8.5 has its own compiled in but not created.
          sudo=$([ "$RUNNER_OS" = Linux ] && echo sudo || true)
          scan_dir="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
          $sudo mkdir -p "$scan_dir"
          git clone --depth 1 --branch 0.11.x https://github.com/php-io-extensions/raven.git ../ext-raven
          (cd ../ext-raven && phpize && ./configure --enable-raven && make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)")
          echo "extension=$(cd ../ext-raven && pwd)/modules/raven.so" | $sudo tee "$scan_dir/99-raven.ini"
          php --ri raven | head -3

      - name: Checkout venusian/topside
        run: git clone --depth 1 --branch 0.11.x https://github.com/VenusianPHP/topside.git ../topside

      - name: Resolve venusian/topside from the checkout
        run: |
          composer config repositories.topside '{"type": "path", "url": "../topside", "options": {"symlink": false}}'

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Execute the Windowless suite
        run: php -d memory_limit=128M vendor/bin/pest --testsuite=Windowless
